<h1>《孟子》盡心章句下．第十九章</h1>
<h1><ruby>貉<rt>ㄏㄜˊ</rt></ruby>稽曰：</h1>
<h1>　「稽大不理於口。」</h1>
<h1>孟子曰：</h1>
<h1>　「無傷也。士<ruby>憎<rt>ㄗㄥ</rt></ruby>茲多口。</h1>
<h1>　　詩云：『憂心<ruby>悄<rt>ㄑㄧㄠˇ</rt></ruby>悄，<ruby>慍<rt>ㄩㄣˋ</rt></ruby>於<ruby>羣<rt>ㄑㄩㄣˊ</rt></ruby>小。』孔子也。</h1>
<h1>　　『肆不<ruby>殄<rt>ㄊㄧㄢˇ</rt></ruby><ruby>厥<rt>ㄐㄩㄝˊ</rt></ruby><ruby>慍<rt>ㄩㄣˋ</rt></ruby>，亦不<ruby>隕<rt>ㄩㄣˇ</rt>
    </ruby><ruby>厥<rt>ㄐㄩㄝˊ</rt></ruby>問。』文王也。」</h1>
<p>&nbsp;</p>
<h2>憎：被憎惡</h2>
<h2>多口：許多的議論與誹謗</h2>
<h2>肆：雖然</h2>
<h2>殄：消除</h2>
<h2>隕：損害</h2>

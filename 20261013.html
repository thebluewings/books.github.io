<h1>《孟子》盡心章句下．第二十二章</h1>
<h1>高子曰：</h1>
<h1>　「禹之聲，尚文王之聲。」</h1>
<h1>孟子曰：</h1>
<h1>　「何以言之？」</h1>
<h1>曰：</h1>
<h1>　「以<ruby>追<rt>ㄉㄨㄟ</rt></ruby><ruby>蠡<rt>ㄌㄧˇ</rt></ruby>。」</h1>
<h1>曰：</h1>
<h1>　「是<ruby>奚<rt>ㄒㄧ</rt></ruby>足哉？城門之軌，兩馬之力<ruby>與<rt>ㄩˊ</rt></ruby>？」</h1>

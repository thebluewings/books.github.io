<h1>《孟子》盡心章句下．第十三章</h1>
<h1>孟子曰：</h1>
<h1>　「不仁而得國者，有之矣；</h1>
<h1>　　不仁而得天下，未之有也。」</h1>
<p>&nbsp;</p>
<h2>天下：全天下百姓的認同、擁護。</h2>

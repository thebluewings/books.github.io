<h1>《孟子》盡心章句下．第十二章</h1>
<h1>孟子曰：</h1>
<h1>　「不信仁賢，則國空虛。</h1>
<h1>　　無禮義，則上下亂。</h1>
<h1>　　無政事，則財用不足。」</h1>

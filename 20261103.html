<h1>《孟子》盡心章句下．第二十五章</h1>
<h1>浩生不害問曰：</h1>
<h1>　「<ruby>樂<rt>ㄩㄝˋ</rt></ruby>正子，何人也？」</h1>
<h1>孟子曰：</h1>
<h1>　「善人也，信人也。」</h1>
<h1>　「何謂善？何謂信？」</h1>
<h1>曰：</h1>
<h1>　「可欲之謂善，有諸己之謂信。</h1>
<h1>　　充實之謂美，充實而有光輝之謂大，</h1>
<h1>　　大而化之之謂聖，聖而不可知之之謂神。</h1>
<h1>　　<ruby>樂<rt>ㄩㄝˋ</rt></ruby>正子，二之中，四之下也。」</h1>

<h1>《孟子》盡心章句下．第十一章</h1>
<h1>孟子曰：</h1>
<h1>　「好名之人，能讓千乘之國；</h1>
<h1>　　苟非其人，簞食豆羹見於色。」</h1>
<p>&nbsp;</p>
<h2>好名：愛好名聲</h2>
<h2>乘：音shèng，古代稱兵車，四馬一車為一乘。千乘之國為諸侯之國</h2>
<h2>苟：如果</h2>
<h2>簞：盛飯的圓形竹器</h2>
<h2>豆：盛食物的木製或陶製器具</h2>
<h2>羹：肉汁或菜湯</h2>
<h2>見：音xiàn，同「現」，表露</h2>
<h2>色：臉色</h2>

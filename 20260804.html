<h1>《孟子》盡心章句下．第十一章</h1>
<h1>孟子曰：</h1>
<h1>　「好名之人，能讓千乘之國；</h1>
<h1>　　苟非其人，簞食豆羹見於色。」</h1>
<p>&nbsp;</p>
<h2>好名：愛好清高名聲</h2>
<h2>讓：辭讓</h2>
<h2>千乘之國：能出動一千輛兵車的國家，諸侯國</h2>
<h2>其人：真正具有高尚德性的人</h2>
<h2>豆：器皿</h2>
<h2>見於色：心裡的情緒顯露在臉上</h2>

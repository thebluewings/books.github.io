<h1>《孟子》盡心章句下．第二十三章</h1>
<h1>齊飢。</h1>
<h1>陳臻曰：</h1>
<h1>　「國人皆以夫子將復為發棠；殆不可復。」</h1>
<h1>孟子曰：</h1>
<h1>　「是為<ruby>馮<rt>ㄆㄧㄥˊ</rt></ruby>婦也。</h1>
<h1>　　晉人有<ruby>馮<rt>ㄆㄧㄥˊ</rt></ruby>婦者，善搏虎，卒為善士。</h1>
<h1>　　則之野，有眾逐虎。</h1>
<h1>　　虎負<ruby>嵎<rt>ㄩˊ</rt></ruby>，莫之敢<ruby>攖<rt>ㄧㄥ</rt></ruby>。</h1>
<h1>　　望見<ruby>馮<rt>ㄆㄧㄥˊ</rt></ruby>婦，趨而迎之。</h1>
<h1>　　<ruby>馮<rt>ㄆㄧㄥˊ</rt></ruby>婦<ruby>攘<rt>ㄖㄤˇ</rt></ruby>臂下車，眾皆悅之，其為士者笑之。」</h1>
<p>&nbsp;</p>

<h1>《孟子》盡心章句下．第十五章</h1>
<h1>孟子曰：</h1>
<h1>　「聖人，百世之師也，伯夷、柳下惠是也。</h1>
<h1>　　故聞伯夷之風者，頑夫廉，懦夫有立志；</h1>
<h1>　　聞柳下惠之風者，薄夫敦，鄙夫寬。</h1>
<h1>
    　　奮乎百世之上，百世之下，聞者莫不興起也。</h1>
<h1>　　非聖人而能若是乎？而況於親炙之者乎！」</h1>

<h1>《孟子》盡心章句下．第十章</h1>
<h1>孟子曰：</h1>
<h1>　「週於利者，兇年不能殺；</h1>
<h1>　　週於德者，邪世不能亂。」</h1>
<p>&nbsp;</p>
<h2>週：通周，周全</h2>
<h2>利：生活的資財</h2>
<h2>週於利者：平時有積蓄的人</h2>
<h2>兇年：荒年，收成不好的年歲</h2>
<h2>德：良心本性，仁義禮智</h2>
<h2>邪世：風氣敗壞的世道</h2>

<h1>《孟子》盡心章句下．第八章</h1>
<h1>孟子曰：</h1>
<h1>　「古之為關也，將以禦暴。</h1>
<h1>　　今之為關也，將以為暴。」</h1>
<p>&nbsp;</p>
<h2>為關：設立關卡。</h2>
<h2>禦暴：抵禦暴徒等會傷害人民的人。</h2>
<h2>為暴：為了關卡欺壓人民。</h2>
<h2>制度一旦變質，就會害民</h2>

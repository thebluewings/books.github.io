<h1>《孟子》盡心章句下．第二十七章</h1>
<h1>孟子曰：</h1>
<h1>　「有布<ruby>縷<rt>ㄌㄩˇ</rt></ruby>之征，粟米之征，力役之征。</h1>
<h1>　　君子用其一，緩其二。</h1>
<h1>　　用其二而民有<ruby>殍<rt>ㄆㄧㄠˇ</rt></ruby>，用其三而父子離。」</h1>

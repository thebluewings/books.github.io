<h1>《孟子》盡心章句下．第十七章</h1>
<h1>孟子曰：</h1>
<h1>　「孔子之去魯，曰：『遲遲吾行也。』</h1>
<h1>　　去父母國之道也。</h1>
<h1>　　去齊，接<ruby>淅<rt>ㄒㄧ</rt></ruby>而行，</h1>
<h1>　　去他國之道也。」</h1>

<h1>《孟子》盡心章句下．第二十四章</h1>
<h1>孟子曰：</h1>
<h1>　「口之於味也，目之於色也，耳之於聲也，鼻之於<ruby>臭<rt>ㄒㄧㄡˋ</rt></ruby>也，</h1>
<h1>　　四肢之於安佚也，性也，有命焉，君子不謂性也。</h1>
<h1>　　仁之於父子也，義之於君臣也，禮之於賓主也，智之於賢者也，</h1>
<h1>　　聖人之於天道也，命也。有性焉；君子不謂命也。」</h1>
<p>&nbsp;</p>
<!-- <h2>臭：氣味。</h2> -->
<!-- <h2>安佚：安逸、安適。佚，通「逸」。</h2> -->
<h2>性也：人心自然的本性 (不是良心本性)</h2>
<h2>有命焉：能不能享受到要看有沒有福份</h2>
<h2>君子不謂性也：君子不以這是人的本性為放縱、追求慾望的理由</h2>
<h2>君子不謂命也：君子不把做不到的原因推給命運</h2>
<h2>命也。有性焉：外在的成就受命運、環境影響，但提升自我德性並不受此影響</h2>

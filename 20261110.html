<h1>《孟子》盡心章句下．第二十六章</h1>
<h1>孟子曰：</h1>
<h1>　「逃墨必歸於楊，逃楊必歸於儒。</h1>
<h1>　　歸斯受之而已矣。</h1>
<h1>　　今之與楊墨辯者，如放豚，既入其<ruby>苙<rt>ㄌㄧˋ</rt></ruby>，又從而招之。」</h1>

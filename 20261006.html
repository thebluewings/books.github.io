<h1>《孟子》盡心章句下．第二十一章</h1>
<h1>孟子謂高子曰：</h1>
<h1>　「山徑之<ruby>蹊<rt>ㄒㄧ</rt></ruby><ruby>間<rt>ㄐㄧㄢˋ</rt></ruby>，介然用之而成路。</h1>
<h1>　　為<ruby>間<rt>ㄐㄧㄢˋ</rt></ruby>不用，則茅塞之矣。</h1>
<h1>　　今茅塞子之心矣。」</h1>

<h1>《孟子》盡心章句下．第二十一章</h1>
<h1>孟子謂高子曰：</h1>
<h1>　「山徑之<ruby>蹊<rt>ㄒㄧ</rt></ruby>間，介然用之而成路。</h1>
<h1>　　為間不用，則茅塞之矣。今茅塞子之心矣。」</h1>
<p>&nbsp;</p>
<h2>山徑：山間的小路。</h2>
<h2>蹊間：人走出來的小路。</h2>
<h2>為間：隔了一段時間。</h2>
<h2>茅塞：被茅草堵塞。</h2>

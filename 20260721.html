<h1>《孟子》盡心章句下．第九章</h1>
<h1>孟子曰：</h1>
<h1>　「身不行道，不行於妻子；</h1>
<h1>　　使人不以道，不能行於妻子。」</h1>
<p>&nbsp;</p>
<h2>行於妻子：連家人、孩子都不能被感化。妻、子，指妻子、小孩</h2>
<h2>「使」人：差使</h2>
<h2>以道：用合乎仁義的方式</h2>
